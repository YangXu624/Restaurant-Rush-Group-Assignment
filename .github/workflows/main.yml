name: Continuous Integration Testing (CI)

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: sh compile.sh

      - name: Unit and integration tests
        run: sh test.sh

      - name: Fixture runs
        run: |
          for f in victory defeat abandonment invalid-input; do
            echo "== $f =="
            sh run.sh < tests/fixtures/m5/$f.txt
          done
